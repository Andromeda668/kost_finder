<svg viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <!-- House roof icon -->
  <g transform="translate(15, 20)">
    <path d="M 20 0 L 40 20 L 0 20 Z" fill="#2D7D5D" stroke="#2D7D5D" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Window frame -->
    <rect x="8" y="24" width="32" height="32" fill="none" stroke="#2D7D5D" stroke-width="1.5"/>
    
    <!-- Window panes -->
    <line x1="24" y1="24" x2="24" y2="56" stroke="#2D7D5D" stroke-width="1.5"/>
    <line x1="8" y1="40" x2="40" y2="40" stroke="#2D7D5D" stroke-width="1.5"/>
    
    <!-- Window glass shades -->
    <rect x="8" y="24" width="16" height="16" fill="#2D7D5D" opacity="0.2"/>
    <rect x="24" y="24" width="16" height="16" fill="#2D7D5D" opacity="0.35"/>
  </g>
  
  <!-- Magnifying glass -->
  <g transform="translate(72, 28)">
    <circle cx="8" cy="8" r="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="16" y1="16" x2="24" y2="24" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- KF Text -->
  <text x="105" y="55" font-family="'Arial', 'Helvetica', sans-serif" font-size="44" font-weight="700" fill="#1a1a1a" letter-spacing="-2">KF</text>
  
  <!-- KOST FINDER -->
  <text x="15" y="88" font-family="'Arial', 'Helvetica', sans-serif" font-size="12" font-weight="600" fill="#2D7D5D" letter-spacing="1.5">KOST FINDER</text>
</svg>
